<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 — Flower Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --cream:        #F7F0E6;
      --cream-light:  #FDF9F4;
      --cream-mid:    #EDE3D5;
      --maroon:       #6B1E2A;
      --maroon-dark:  #4A1219;
      --maroon-light: #9B3A4A;
      --maroon-mist:  #F9F0F1;
      --gold:         #B8965A;
      --gold-light:   #D4B07A;
      --charcoal:     #2A1A1F;
      --text-muted:   #7A6068;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream-light);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
    }

    /* ── Split Layout ── */
    .auth-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      width: 100%;
    }
    @media (max-width: 767.98px) {
      .auth-wrapper { grid-template-columns: 1fr; }
    }

    /* ── Left Visual Panel ── */
    .auth-visual {
      position: relative;
      overflow: hidden;
    }
    @media (max-width: 767.98px) {
      .auth-visual {
        min-height: 280px;
        order: 0;
      }
    }

    .auth-visual img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .auth-visual-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(74,18,25,.65) 0%, rgba(107,30,42,.45) 100%);
    }
    .auth-visual-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem;
      color: #fff;
    }

    .auth-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-decoration: none;
      color: #fff;
    }
    .auth-logo span { color: var(--gold-light); font-weight: 300; }

    .visual-quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 3vw, 2.8rem);
      font-weight: 300;
      line-height: 1.25;
      color: #fff;
      font-style: italic;
    }
    .visual-quote-attr {
      font-size: .78rem;
      color: rgba(255,255,255,.55);
      letter-spacing: .1em;
      margin-top: .8rem;
    }

    /* ── Right Form Panel ── */
    .auth-form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 2rem;
      background: var(--cream-light);
      overflow-y: auto;
    }
    @media (min-width: 768px) {
      .auth-form-panel { padding: 3rem 4rem; }
    }

    .form-inner { max-width: 420px; margin: 0 auto; width: 100%; }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1.5px solid var(--cream-mid);
      margin-bottom: 2.2rem;
    }
    .auth-tab {
      background: none;
      border: none;
      font-family: 'Jost', sans-serif;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: .9rem 1.6rem .75rem;
      cursor: pointer;
      position: relative;
      transition: color .2s;
    }
    .auth-tab::after {
      content: '';
      position: absolute;
      bottom: -1.5px; left: 0; right: 0;
      height: 2.5px;
      background: var(--maroon);
      transform: scaleX(0);
      transition: transform .25s ease;
    }
    .auth-tab.active {
      color: var(--maroon);
    }
    .auth-tab.active::after {
      transform: scaleX(1);
    }

    /* ── Welcome Text ── */
    .auth-welcome {
      margin-bottom: 2rem;
    }
    .auth-welcome h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--charcoal);
      margin-bottom: .35rem;
    }
    .auth-welcome p {
      font-size: .88rem;
      color: var(--text-muted);
    }

    /* ── Form Controls ── */
    .form-label {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--charcoal);
      margin-bottom: .5rem;
    }

    .form-control {
      background: #fff;
      border: 1.5px solid var(--cream-mid);
      border-radius: 3px;
      color: var(--charcoal);
      font-family: 'Jost', sans-serif;
      font-size: .9rem;
      padding: .75rem 1rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      border-color: var(--maroon);
      box-shadow: 0 0 0 3px rgba(107,30,42,.08);
      background: #fff;
      color: var(--charcoal);
    }
    .form-control::placeholder { color: var(--text-muted); font-weight: 300; }

    /* ── Password toggle ── */
    .input-group-text {
      background: #fff;
      border: 1.5px solid var(--cream-mid);
      border-left: none;
      border-radius: 0 3px 3px 0;
      cursor: pointer;
      color: var(--text-muted);
      transition: color .2s;
      padding: .75rem .9rem;
    }
    .input-group-text:hover { color: var(--maroon); }
    .input-group .form-control {
      border-right: none;
      border-radius: 3px 0 0 3px;
    }
    .input-group .form-control:focus ~ .input-group-text {
      border-color: var(--maroon);
    }

    /* ── Forgot link ── */
    .forgot-link {
      font-size: .78rem;
      color: var(--maroon);
      text-decoration: none;
      font-weight: 500;
      transition: opacity .2s;
    }
    .forgot-link:hover { opacity: .75; text-decoration: underline; }

    /* ── Submit Button ── */
    .btn-auth {
      background: var(--maroon);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: 'Jost', sans-serif;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 1rem;
      width: 100%;
      transition: background .2s, transform .15s;
    }
    .btn-auth:hover {
      background: var(--maroon-dark);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ── Divider ── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: .78rem;
      letter-spacing: .06em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--cream-mid);
    }

    /* ── Social Buttons ── */
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      background: #fff;
      border: 1.5px solid var(--cream-mid);
      border-radius: 3px;
      font-family: 'Jost', sans-serif;
      font-size: .82rem;
      font-weight: 500;
      color: var(--charcoal);
      padding: .75rem 1rem;
      width: 100%;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, background .2s;
      text-decoration: none;
    }
    .btn-social:hover {
      border-color: var(--maroon-light);
      box-shadow: 0 2px 12px rgba(107,30,42,.08);
      background: var(--maroon-mist);
      color: var(--charcoal);
    }
    .btn-social img {
      width: 18px; height: 18px;
    }

    /* ── Remember me checkbox ── */
    .form-check-input:checked {
      background-color: var(--maroon);
      border-color: var(--maroon);
    }
    .form-check-input:focus { box-shadow: 0 0 0 3px rgba(107,30,42,.1); }
    .form-check-label { font-size: .82rem; color: var(--text-muted); }

    /* ── Register link ── */
    .auth-switch {
      text-align: center;
      font-size: .82rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }
    .auth-switch a {
      color: var(--maroon);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch a:hover { text-decoration: underline; }

    /* ── Floating decorative ── */
    .deco-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp .6s ease both; }
    .delay-1 { animation-delay: .1s; }
    .delay-2 { animation-delay: .2s; }
    .delay-3 { animation-delay: .3s; }
  </style>
</head>
<body>

  <div class="auth-wrapper">

    <!-- Left: Visual -->
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=800&q=80"
        alt="花卉背景" />
      <div class="auth-visual-overlay"></div>
      <div class="auth-visual-content">
        <a class="auth-logo" href="index.html">Flower <span>Life</span></a>

        <div>
          <div class="visual-quote">
            "花朵是大地的<br />最美詩篇，每一瓣<br />都述說著愛。"
          </div>
          <div class="visual-quote-attr">— FLOWER LIFE 品牌精神</div>

          <!-- Feature highlights -->
          <div class="d-flex flex-column gap-3 mt-4">
            <div class="d-flex align-items-center gap-3">
              <div style="width:32px;height:32px;background:rgba(184,150,90,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-truck" style="color:var(--gold-light);font-size:.85rem;"></i>
              </div>
              <div>
                <div style="font-size:.78rem;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.05em;">全台免費配送</div>
                <div style="font-size:.7rem;color:rgba(255,255,255,.5);">訂單滿 NT$800 即享</div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <div style="width:32px;height:32px;background:rgba(184,150,90,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-flower1" style="color:var(--gold-light);font-size:.85rem;"></i>
              </div>
              <div>
                <div style="font-size:.78rem;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.05em;">當季最新鮮花卉</div>
                <div style="font-size:.7rem;color:rgba(255,255,255,.5);">直接向花農採購</div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <div style="width:32px;height:32px;background:rgba(184,150,90,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="bi bi-gift" style="color:var(--gold-light);font-size:.85rem;"></i>
              </div>
              <div>
                <div style="font-size:.78rem;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.05em;">會員專屬優惠</div>
                <div style="font-size:.7rem;color:rgba(255,255,255,.5);">首購 9 折，積點兌換禮品</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Form -->
    <div class="auth-form-panel">
      <div class="form-inner">

        <!-- Tabs: 登入 / 註冊 -->
        <div class="auth-tabs fade-up">
          <button class="auth-tab active" onclick="window.location='login.html'">登入</button>
          <button class="auth-tab" onclick="window.location='register.html'">建立帳號</button>
        </div>

        <!-- Welcome -->
        <div class="auth-welcome fade-up delay-1">
          <h1>歡迎回來</h1>
          <p>登入以查看您的訂單、購物車與會員專屬優惠。</p>
        </div>

        <!-- Social Login -->
        <div class="d-flex flex-column gap-2 mb-3 fade-up delay-2">
          <a href="#" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.5 3.2l6.4-6.4C34.8 2.7 29.8.5 24 .5 14.9.5 7.1 5.8 3.4 13.4l7.5 5.8C12.7 13.3 17.9 9.5 24 9.5z"/>
              <path fill="#4A90D9" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.8 6.8-16.9z" style="fill:#4285F4"/>
              <path fill="#FBBC05" d="M10.9 28.8A14.8 14.8 0 0 1 9.5 24c0-1.7.3-3.3.8-4.8l-7.5-5.8A23.5 23.5 0 0 0 .5 24c0 3.8.9 7.4 2.5 10.6l7.9-5.8z"/>
              <path fill="#34A853" d="M24 47.5c5.8 0 10.7-1.9 14.3-5.2l-7.4-5.7c-2 1.3-4.5 2.1-6.9 2.1-6.1 0-11.3-3.8-13.2-9.1l-7.9 5.8C7.1 42.2 14.9 47.5 24 47.5z"/>
            </svg>
            以 Google 帳號繼續
          </a>
          <a href="#" class="btn-social">
            <i class="bi bi-facebook" style="font-size:1.1rem;color:#1877F2;"></i>
            以 Facebook 帳號繼續
          </a>
          <a href="#" class="btn-social">
            <i class="bi bi-line" style="font-size:1.1rem;color:#06C755;"></i>
            以 LINE 帳號繼續
          </a>
        </div>

        <div class="auth-divider fade-up delay-2">或使用電子郵件</div>

        <!-- Login Form -->
        <form id="loginForm" novalidate class="fade-up delay-3">
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label" for="email">電子郵件</label>
            <input type="email" class="form-control" id="email"
              placeholder="your@email.com" required />
          </div>

          <!-- Password -->
          <div class="mb-2">
            <label class="form-label" for="password">密碼</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password"
                placeholder="輸入密碼" required minlength="6" />
              <button class="input-group-text" type="button" id="togglePassword"
                aria-label="顯示/隱藏密碼">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <!-- Remember me + Forgot -->
          <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">記住我</label>
            </div>
            <a href="#" class="forgot-link">忘記密碼？</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-auth">
            <span id="loginText">登入帳號</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>

          <!-- Error message -->
          <div id="errorMsg" class="alert d-none mt-3" style="background:var(--maroon-mist);border:1px solid rgba(107,30,42,.2);border-radius:3px;color:var(--maroon);font-size:.82rem;padding:.7rem 1rem;"></div>
        </form>

        <!-- Switch to register -->
        <div class="auth-switch fade-up delay-3">
          還沒有帳號？ <a href="register.html">立即免費加入</a>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-3 fade-up delay-3">
          <a href="index.html" style="font-size:.78rem;color:var(--text-muted);text-decoration:none;">
            <i class="bi bi-arrow-left me-1"></i> 返回首頁
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Password show/hide toggle
    const toggle = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    // Form submission
    const form = document.getElementById('loginForm');
    const loginText = document.getElementById('loginText');
    const loginSpinner = document.getElementById('loginSpinner');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('請填寫所有必填欄位。');
        return;
      }

      // Loading state
      loginText.textContent = '登入中…';
      loginSpinner.classList.remove('d-none');
      errorMsg.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.data?.token) {
          localStorage.setItem('flower_token', data.data.token);
          localStorage.setItem('flower_user', JSON.stringify(data.data.user));
          window.location.href = '/';
        } else {
          showError(data.message || '電子郵件或密碼錯誤，請再試一次。');
        }
      } catch (err) {
        showError('網路錯誤，請稍後再試。');
      } finally {
        loginText.textContent = '登入帳號';
        loginSpinner.classList.add('d-none');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('d-none');
    }
  </script>
</body>
</html>
